@if (registrationComplete()) {
  <section class="mx-auto w-full max-w-2xl">
    <div class="flex flex-col items-center gap-3 py-10 text-center" role="status">
      <h2 class="text-xl font-semibold text-slate-900">Check your email</h2>
      <p class="max-w-sm text-slate-600">
        We've sent a verification link to your email address. Check your inbox and click the link to activate your account before signing in.
      </p>
    </div>
  </section>
} @else {
  <section class="mx-auto w-full max-w-2xl">
    <app-signup-form
      [stateOptions]="statesResource.value() ?? []"
      [statesLoading]="statesResource.isLoading()"
      [localGovernmentOptions]="localGovernmentsResource.value() ?? []"
      [localGovernmentsLoading]="localGovernmentsResource.isLoading()"
      [wardOptions]="wardsResource.value() ?? []"
      [wardsLoading]="wardsResource.isLoading()"
      (stateFieldFocused)="onStateFieldFocused()"
      (stateSelected)="onStateSelected($event)"
      (localGovernmentSelected)="onLocalGovernmentSelected($event)"
      [submitting]="submitting()"
      [serverError]="serverError()"
      (formSubmit)="onSignupSubmit($event)"
    />
  </section>
}
